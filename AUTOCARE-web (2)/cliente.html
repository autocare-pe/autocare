      const id = ds.calificar; if (!sel["e" + id]) return alerta("Elige de 1 a 5 estrellas.");

        const g = D.negocio.google;
        b.closest("section").innerHTML = `<h2>¡Gracias por tu opinión!</h2><p style="margin:8px 0 14px">Nos ayuda a mejorar cada servicio.</p>${g ? `<p class="nota" style="margin-bottom:10px">¿Nos ayudas contándolo también en Google? Toma un minuto.</p><a class="btn oro" href="${h(g)}" target="_blank" rel="noopener">Dejar reseña en Google</a>` : ""}`;
      } catch (err) { alerta(err.message); b.disabled = false; }
    } else if (b.id === "ver-tarjeta") { history.replaceState(null, "", location.pathname + location.search + "#t=" + t); O = ""; M = null; window.scrollTo(0, 0); cargar(); }
    else if (b.id === "d-guardar") accion("datos", { email: $("#d-email").value, cumple: $("#d-cumple").value, acepta: $("#d-acepta").checked });
    else if (b.id === "compartir") {
      const txt = `Te recomiendo ${D.negocio.nombre}: lavan tu auto en tu casa y queda como nuevo. Reserva con mi código ${D.referido.codigo}: ${D.referido.enlace}`;
      if (navigator.share) navigator.share({ text: txt }).catch(() => { }); else window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
    } else if (b.id === "g-guardar") {
      const val = k => (document.querySelector(`input[name="${k}"]:checked`) || {}).value || "";
      b.disabled = true; accion("datos", { gustos: { importa: val("g-importa"), aroma: val("g-aroma"), mascota: val("g-mascota"), nota: $("#g-nota").value } }, M ? "gracias-gustos" : "gustos");
    } else if (b.id === "qr-ref") {
      const caja = $("#qr-ref-caja");
      if (!caja.querySelector("svg")) { const { qrSvg } = await import("./assets/qr.js"); caja.querySelector(".qr").innerHTML = qrSvg(D.referido.enlace || D.referido.codigo, { margen: 3 }); }
      caja.classList.toggle("oculto"); b.textContent = caja.classList.contains("oculto") ? "Mostrar mi QR" : "Ocultar mi QR";
    } else if (b.id === "copiar-cod") { try { await navigator.clipboard.writeText(D.referido.enlace || D.referido.codigo); b.textContent = "¡Copiado!"; } catch (err) { } }
  };
}
// Sin enlace: pide su número y le llega su tarjeta por WhatsApp. Nunca mostramos datos con solo un número.
function entrada(error) {
  let tel = CFG.WHATSAPP || "";
  api("publico").then(P => { tel = ((P && P.negocio) || {}).tel || tel; }).catch(() => { });   // el número de Configuración → Negocio
  $("#app").innerHTML = `<div class="hola"><h1>Tu tarjeta AUTOCARE</h1><p class="nota">Tus sellos, las fotos de tu auto y tu próxima hora, en un solo lugar.</p></div>
    ${error ? `<div class="aviso rojo" style="margin:16px 0">${h(error)}</div>` : ""}
    <section class="caja tarjeta" style="margin-top:20px" id="caja-pedir"><h2>¿Ya eres cliente?</h2>
      <p class="nota" style="margin-bottom:14px">Escribe tu WhatsApp y te enviamos el enlace de tu tarjeta. Por tu seguridad, solo llega a tu número.</p>
      <form id="pedir"><label class="campo">Tu número de WhatsApp<input class="entrada" id="p-tel" inputmode="tel" autocomplete="tel" placeholder="987 654 321" required></label>
        <input type="text" id="p-web" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
        <div id="p-error" class="aviso rojo oculto" style="margin-top:10px"></div>
        <button class="btn oro bloque" style="margin-top:12px" type="submit">Recibir mi enlace por WhatsApp</button></form>
      <p class="nota" style="margin-top:12px">¿Tienes tu tarjeta o el sticker de tu auto? Escanea su QR o acércala a tu celular.</p></section>
    <section class="caja tarjeta"><h2>¿Todavía no eres cliente?</h2><p class="nota" style="margin-bottom:14px">Con tu primer servicio, tu tarjeta llega con sellos de regalo.</p>
      <a class="btn oro bloque" href="./?src=portal#paquetes">Separar mi primera hora</a></section>`;
  $("#pedir").addEventListener("submit", async e => {
    e.preventDefault();
    const b = e.target.querySelector("button"); b.disabled = true; b.textContent = "Enviando…";
    try {
      await api("portalPedir", { tel: $("#p-tel").value, web: $("#p-web").value });
      $("#caja-pedir").innerHTML = `<h2>¡Listo!</h2><p style="margin-top:6px">Si tu número está registrado, te enviamos tu enlace por WhatsApp lo antes posible.</p>
        ${tel ? `<p class="nota" style="margin-top:12px">¿No te llega? <a href="${wa(tel, "Hola, quiero el enlace de mi tarjeta AUTOCARE.")}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>.</p>` : ""}`;
    } catch (err) { const p = $("#p-error"); p.textContent = err.message; p.classList.remove("oculto"); b.disabled = false; b.textContent = "Recibir mi enlace por WhatsApp"; }
  });
}
let RUL = null;
async function girar(b, id) {
  b.disabled = true; b.textContent = "Girando…";
  const sv = $("#ruleta .rueda"), res = $("#ruleta-res");
  try {
    const r = await api("portalAccion", { t, accion: "girar", id }), p = r.premio, R = (M && M.ruleta) || (D && D.ruleta);
    const lento = !RM();
    if (sv && RUL) { sv.style.transition = `transform ${lento ? 4.6 : 0.6}s cubic-bezier(.12,.72,.14,1)`; sv.style.transform = `rotate(${RUL.anguloPara(R.premios, p.id, lento ? 6 : 1)}deg)`; }
    await new Promise(ok => setTimeout(ok, lento ? 4800 : 700));
    res.innerHTML = `<div class="premio-ganado"><small>¡Ganaste!</small><b>${h(String(p.n).replace(/ (gratis )?en tu próxima visita$/i, (m, g) => g ? " gratis" : ""))}</b><span>${p.tipo === "sello" ? "Ya está en tu tarjeta de sellos." : "Úsalo en tu próxima visita, hasta el " + fechaLarga(p.vence) + "."}</span></div>
      <a class="btn oro bloque" href="./?src=ruleta#paquetes">Separar mi próxima hora</a>`;
    res.classList.remove("oculto"); b.remove();
    if (navigator.vibrate) try { navigator.vibrate([30, 40, 60]); } catch (e) { }
  } catch (e) { alerta(e.message); b.disabled = false; b.textContent = "Girar la ruleta"; }
}
function errorCarga(e) {
  if (/no es válido|cambió/i.test(e.message)) { recordar(""); t = ""; return entrada("Este enlace ya no funciona (quizá lo cambiamos por tu seguridad). Pide el nuevo aquí abajo."); }
  if ($(".esqueleto")) $("#app").innerHTML = `<div class="aviso rojo">${h(e.message)}</div><p style="margin-top:16px"><button class="btn" onclick="location.reload()">Intentar de nuevo</button></p>`;
}
const vistos = {};
async function cargar({ animar = true } = {}) {
  if (!t) return entrada();
  const rul = RUL ? Promise.resolve(RUL) : import("./assets/ruleta.js").then(m => (RUL = m)).catch(() => null);
  if (O) {                                         // una pantalla por momento
    const k = "ac_m_" + O, c = cacheLeer(k), antes = M ? JSON.stringify(M) : "";
    if (c && !M && c.orden) { await rul; M = c; pintarMomento(true); animar = false; }
    try {
      const r = await api("portalOrden", { t, o: O }); await rul;
      if (!r.orden || !r.momento) { history.replaceState(null, "", location.pathname + location.search + "#t=" + t); O = ""; M = null; return cargar(); }
      recordar(t); cacheGuardar(k, r);
      if (JSON.stringify(r) !== antes && JSON.stringify(r) !== JSON.stringify(c)) { M = r; pintarMomento(animar); }
      else if (!$("#app .momento")) { M = r; pintarMomento(animar); }
      if (r.momento === "llegada" && !r.orden.recepcion.respuesta && !vistos[O]) { vistos[O] = 1; api("portalAccion", { t, accion: "visto", id: O }).catch(() => { }); }
    } catch (e) { errorCarga(e); }
    return;
  }
  const k = "ac_p_" + t.slice(0, 12), c = cacheLeer(k), antes = D ? JSON.stringify(D) : "";
  if (c && !D) { await rul; D = c; PUB = c.pub || null; pintar(true); animar = false; }
  try {
    const r = await api("portal", { t }); await rul;
    recordar(t); cacheGuardar(k, r);
    if (!/t=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search + "#t=" + t);
    if (JSON.stringify(r) !== antes && JSON.stringify(r) !== JSON.stringify(c)) { D = r; PUB = r.pub || null; pintar(animar); }
    else if (!$("#app .hola")) { D = r; PUB = r.pub || null; pintar(animar); }
  } catch (e) { errorCarga(e); }
}

// ---------------------------------------------------------------- piezas que se repiten
const DAN = { rayon: "Rayón", abolladura: "Abolladura", mancha: "Mancha", rotura: "Rotura o falta pieza", otro: "Otro" };
const CHECK = `<svg class="check-anim" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/><path d="M15.5 27.5l7 7 14.5-15.5"/></svg>`;
function calificarHtml(o) {
  const g = (D || M).negocio.google, e = o.estrellas || 0;
  return `<section class="caja tarjeta" id="cal-${o.id}"><h2>${e ? "¡Gracias por tu opinión!" : "¿Cómo te fue?"}</h2><p class="nota">${h(o.servicios)} · ${fechaLarga(o.fecha)}</p>
    <div class="estrellas" style="margin:12px 0">${[1, 2, 3, 4, 5].map(i => `<button data-cal="${o.id}" data-est="${i}" aria-label="${i} ${i === 1 ? "estrella" : "estrellas"}" class="${i <= e ? "si" : ""}" style="--k:${i}">★</button>`).join("")}</div>
    ${!e ? `<p class="nota">Un toque basta.</p>` : `${o.comentario ? `<p class="nota">✓ Recibimos tu comentario.</p>` : `<textarea class="entrada" id="com-${o.id}" placeholder="${e >= 4 ? "¿Qué fue lo que más te gustó? (opcional)" : "¿Qué podemos hacer mejor? Lo leemos todos. (opcional)"}"></textarea>
      <button class="btn chico" style="margin-top:8px" data-comentar="${o.id}" data-est="${e}">Enviar comentario</button>`}
      ${g ? `<p class="nota" style="margin:14px 0 8px">Si tienes un minuto, contarlo en Google ayuda a otras personas de Arequipa a elegir. Bueno o malo, nos sirve.</p><a class="btn oro" href="${h(g)}" target="_blank" rel="noopener">Contarlo en Google</a>` : ""}`}</section>`;
}
// Ruleta de premios: el cierre que se recuerda (Kahneman, pico y final). Siempre gana algo; el premio es para su próxima visita.
function ruletaHtml(R, id, fecha) {
  return `<section class="caja tarjeta ruleta-caja" id="ruleta"><h2>Tienes un giro de premios 🎁</h2><p class="nota">${fecha ? "Por tu servicio del " + fechaLarga(fecha) + ". " : ""}Siempre ganas algo, para usar en tu próxima visita.</p>
    <div class="ruleta-wrap">${RUL ? RUL.ruletaSvg(R.premios, { marca: "assets/marca-chica-clara.svg" }) : ""}</div>
    <div id="ruleta-res" class="oculto" aria-live="polite"></div>
    <button class="btn oro bloque grande" data-girar="${id}">Girar la ruleta</button>
    <details class="opcional"><summary>Bases y probabilidades</summary><p class="nota" style="margin-top:8px">Organiza ${h((D || M).negocio.nombre)}. Un giro por cada servicio pagado de ${soles(R.minimo)} o más, hasta ${R.dias} días después de la entrega.
      Premios: ${R.premios.map(p => `${h(p.n)} (${p.prob}%${p.max ? `, máximo ${p.max} al mes` : ""})`).join("; ")}. Si un premio con tope se agota en el mes, ese giro se reparte entre los demás.
      Se usa en tu siguiente visita, uno por visita, dentro de ${R.vence} días. Es personal y no se cambia por dinero ni se suma a otras promociones.</p></details></section>`;
}
// sus gustos. Danny Meyer (colecciona los puntos), Nir Eyal (inversión) y Christensen (Jobs to Be Done)
function formGustosHtml(g) {
  const opc = (nombre, vals) => `<div class="chips" role="radiogroup">${vals.map(v => `<label class="chip-r"><input type="radio" name="${nombre}" value="${h(v)}" ${g[nombre.slice(2)] === v ? "checked" : ""}><span>${h(v)}</span></label>`).join("")}</div>`;
  return `<p class="campo-t">Lo que más te importa</p>${opc("g-importa", ["Que se vea impecable", "Cuidar la pintura del sol", "Interior limpio (niños o mascotas)", "Venderlo a mejor precio", "Ahorrar mi tiempo"])}
    <p class="campo-t">Aroma</p>${opc("g-aroma", ["Sin aroma", "Suave", "Intenso"])}<p class="campo-t">¿Viajas con mascota?</p>${opc("g-mascota", ["Sí", "No"])}
    <label class="campo">Algo que debamos saber<textarea class="entrada" id="g-nota" placeholder="Dónde dejas las llaves, una zona delicada, algo que prefieres que no toquemos…">${h(g.nota || "")}</textarea></label>
    <button class="btn oro bloque" style="margin-top:12px" id="g-guardar">Guardar mis gustos</button>`;
}
function carrusel(fotos, alt) {
  if (!fotos || !fotos.length) return "";
  return `<div class="carrusel-m"><div class="carrusel" tabindex="0" aria-label="${h(alt)}s">${fotos.map((x, i) => `<img src="${h(x)}" alt="${h(alt)} ${i + 1}" ${i ? 'loading="lazy"' : 'fetchpriority="high"'} decoding="async">`).join("")}</div>
    ${fotos.length > 1 ? `<div class="puntos" aria-hidden="true">${fotos.map((_, i) => `<i class="${i ? "" : "act"}"></i>`).join("")}</div><span class="contador">1 / ${fotos.length}</span>` : ""}</div>`;
}

// ---------------------------------------------------------------- un momento, una pantalla (Fogg: un aviso, una acción)
function pintarMomento(animar = true) {
  const o = M.orden, n = M.negocio, c = M.cliente, nom = h(String(c.nombre || "").split(" ")[0]);
  const veh = h(String(o.vehiculo || "auto").replace(/\s*\(.*\)$/, "")) || "auto";
  let out = `<div id="alerta" class="aviso rojo oculto" style="margin-bottom:14px"></div>`;
  if (M.momento === "llegada") {
    const r = o.recepcion, resp = r.respuesta;
    out += `<section class="momento"><p class="etiqueta-m">${resp ? "Revisión de llegada" : "Un paso · 10 segundos"}</p>
      <h1>Así recibimos tu ${veh}</h1><p class="nota">${h(o.servicios)} · ${fechaLarga(o.fecha)}</p>
      ${carrusel(r.fotos, "Foto de llegada")}
      <div class="hallazgos">${r.items.length ? r.items.map((i, k) => `<span class="hallazgo" style="--k:${k}"><b>${h(DAN[i.estado] || i.estado)}</b>${h(i.zona)}${i.nota ? " · " + h(i.nota) : ""}</span>`).join("") : `<span class="hallazgo ok"><b>✓</b>Sin detalles a la vista</span>`}</div>
      ${r.objetos ? `<p class="nota">Objetos en el auto: ${h(r.objetos)}</p>` : ""}${r.obs ? `<p class="nota">${h(r.obs)}</p>` : ""}
      ${resp ? `<div class="hecho-m ${recien === "llegada" ? "nuevo" : ""} ${resp.estado === "observacion" ? "obs" : ""}">${resp.estado === "observacion" ? `<span class="ico-obs" aria-hidden="true">!</span>` : CHECK}
          <div><b>${resp.estado === "observacion" ? "Recibimos tu observación" : "¡Gracias, " + nom + "!"}</b><p>${resp.estado === "observacion" ? "«" + h(resp.texto) + "». La revisamos contigo antes de entregarte el auto." : "Ya estamos trabajando en tu auto. Te avisamos cuando esté listo."}</p>${resp.nota ? `<p class="nota">Tu nota: «${h(resp.nota)}»</p>` : ""}</div></div>
        ${r.cerrada ? "" : `<button class="btn chico" data-rec-cambiar="${o.id}">Cambiar mi respuesta</button>`}` : ""}
      <div id="rec-acc-${o.id}" class="acciones-m ${resp ? "oculto" : ""}">
        <p class="nota">¿Coincide con lo que ves? Confírmalo con un toque. Si no respondes, igual seguimos: las fotos quedan como registro.</p>
        <button class="btn oro grande bloque" data-rec-ok="${o.id}">✓ Está todo bien</button>
        <button class="btn bloque" data-rec-obs="${o.id}">Algo no coincide</button>
        <div id="rec-obs-${o.id}" class="oculto"><textarea class="entrada" id="rec-txt-${o.id}" placeholder="¿Qué viste distinto? Ej.: ese rayón no estaba."></textarea><button class="btn oro bloque" style="margin-top:8px" data-rec-enviar="${o.id}">Enviar mi observación</button></div>
        <details class="opcional"><summary>Agregar una nota para hoy (opcional)</summary><textarea class="entrada" id="rec-nota-${o.id}" placeholder="Ej.: sin aroma, las llaves están en portería, cuidado con la silla del bebé"></textarea></details>
        <details class="opcional"><summary>Prefiero firmar (opcional)</summary>${firmaForm("rec-" + o.id, "Revisé el estado de mi auto", "Firmar y confirmar")}</details>
      </div></section>`;
    if (resp && resp.estado !== "observacion" && !(c.gustos && c.gustos.fecha)) out += `<section class="caja tarjeta" id="gracias-gustos"><h2>¿Cómo te gusta tu auto?</h2><p class="nota">Opcional, 20 segundos. La próxima vez lo atendemos sin que tengas que repetirlo.</p>${formGustosHtml({})}</section>`;
    else if (resp && c.gustos && c.gustos.fecha) out += `<p class="nota" id="gracias-gustos" style="text-align:center">✓ Ya sabemos cómo te gusta tu auto.</p>`;
  } else if (M.momento === "listo") {
    out += `<section class="momento"><p class="etiqueta-m">Tu auto está listo</p><h1>¡Quedó como nuevo! ✨</h1><p class="nota">${h(o.servicios)} · Total ${soles(o.total)}</p>
      ${o.antes.length && o.despues.length ? comparador(o.antes[0], o.despues[0]) + `<p class="nota" style="margin-top:6px">Desliza para comparar.</p>` : carrusel(o.despues, "Foto de después")}
      <p style="margin-top:14px">Te lo entregamos en un momento. ¡Gracias por confiar en nosotros!</p></section>`;
  } else {
    out += `<section class="momento"><p class="etiqueta-m">¡Gracias, ${nom}!</p><h1>Así quedó tu ${veh}</h1>
      ${o.fotosBorradas ? `<p class="nota">Las fotos de este servicio ya no están disponibles.</p>` : o.antes.length && o.despues.length ? comparador(o.antes[0], o.despues[0]) + `<p class="nota" style="margin-top:6px">Desliza para comparar.</p>` : carrusel(o.despues, "Foto de después")}</section>`;
    if (o.calificable) out += calificarHtml({ id: o.id, servicios: o.servicios, fecha: o.fecha, estrellas: o.calificacion, comentario: o.comentario });
    if (M.ruleta) out += ruletaHtml(M.ruleta, o.id, "");
    if (M.premio && M.premio.tipo !== "sello" && M.premio.estado === "pendiente") out += `<section class="caja tarjeta"><h2>Tu premio 🎁</h2><div class="par"><span>${h(M.premio.n)}</span><b>hasta el ${fechaLarga(M.premio.vence)}</b></div><p class="nota" style="margin-top:8px">Avísanos al reservar y lo aplicamos ese día.</p></section>`;
    const f = M.fidelidad;
    if (f && f.activo) out += `<section class="tarjeta-sellos tarjeta" id="sellos"><div class="sellos ts">${Array.from({ length: f.cada }, (_, i) => `<span class="sello ${i < f.actuales ? "si" : ""}" style="--k:${i}">${i < f.actuales ? "✦" : i === f.cada - 1 ? "🎁" : ""}</span>`).join("")}</div>
      <p class="ts-txt">${f.disponibles ? `<b>¡Completaste tu tarjeta!</b> Pide tu regalo en tu próxima cita.` : `<b>Llevas ${f.actuales} de ${f.cada}.</b> ${f.cada - f.actuales === 1 ? "¡Te falta solo 1 sello!" : `Te faltan ${f.cada - f.actuales} para tu regalo.`}`}</p></section>`;
    out += `<a class="btn oro bloque grande" href="./?src=portal#paquetes">Separar mi próxima hora</a>`;
  }
  out += `<p class="nota" style="text-align:center;margin-top:20px"><button class="enlace-btn" id="ver-tarjeta">Ver mi tarjeta completa</button>${n.tel ? ` · <a href="${wa(n.tel, "Hola, soy " + c.nombre + ".")}" target="_blank" rel="noopener">Escríbenos</a>` : ""}</p>`;
  $("#app").innerHTML = out;
  recien = "";
  conectar(); vivo(animar);
}

// ---------------------------------------------------------------- movimiento con propósito (Val Head; Material: 200–400 ms)
// Entrada escalonada (orienta la vista), fotos que se pasan con el dedo, antes y después que se desliza solo una vez
// (muestra que se puede tocar) y sellos que se estampan. Nada de esto ocurre si el celular pide menos movimiento.
function vivo(animar) {
  const app = $("#app");
  if (animar && !RM()) [...app.children].forEach((el, i) => { el.classList.add("entra"); el.style.setProperty("--i", Math.min(i, 8)); });
  app.querySelectorAll(".carrusel-m").forEach(cm => {
    const car = cm.querySelector(".carrusel"), pts = [...cm.querySelectorAll(".puntos i")], cont = cm.querySelector(".contador");
    if (!pts.length) return;
    car.addEventListener("scroll", () => { const k = Math.round(car.scrollLeft / Math.max(1, car.clientWidth)); pts.forEach((p, i) => p.classList.toggle("act", i === k)); if (cont) cont.textContent = (k + 1) + " / " + pts.length; }, { passive: true });
  });
  const cmp = app.querySelector(".comparar");
  if (cmp && animar && !RM()) {
    const inp = cmp.querySelector("input"), pasos = [[0, 50], [500, 22], [1100, 78], [1600, 50]], t0 = performance.now() + 700;
    const paso = ahora => {
      const x = ahora - t0; if (x < 0) return requestAnimationFrame(paso);
      let v = 50; for (let i = 1; i < pasos.length; i++) if (x <= pasos[i][0]) { const [a, va] = pasos[i - 1], [b, vb] = pasos[i], u = (x - a) / (b - a), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; v = va + (vb - va) * e; break; }
      cmp.style.setProperty("--corte", v + "%"); if (inp) inp.value = v;
      if (x < pasos[pasos.length - 1][0]) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  }
}
cargar();
