<style>
/* Entrada con el logo (Val Head, «Designing Interface Animation»; principios de Disney: anticipación y seguimiento;
   Material Motion: el logo «viaja» a su lugar en la barra, así se entiende de dónde viene).
   Completa (con el nombre) al abrir la app: ~1,8 s. Si la vuelves a abrir antes de 10 minutos, corta (~1 s).
   Mientras corre, la app ya carga por detrás; un toque la salta. */
#intro{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#000;transition:background-color .45s ease .1s,opacity .18s ease}
#intro .in-caja{display:flex;flex-direction:column;align-items:center;gap:26px;transform:translateY(-3vh)}
#intro .in-vuelo{position:relative;transform-origin:0 0;transition:transform .6s cubic-bezier(.5,-.2,.2,1),opacity .2s}
#intro .in-marca{display:block;width:min(36vw,150px);height:auto;overflow:visible;animation:in-pop .7s cubic-bezier(.3,1.45,.55,1) both,in-brillo 1.4s .3s both}
#intro .cuerpo{fill:#fff;transition:fill .4s}
#intro .acento{fill:#D0FF14;animation:in-luz .6s .4s both}
#intro .in-halo{position:absolute;left:50%;top:50%;width:260%;aspect-ratio:1;margin:-130% 0 0 -130%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(208,255,20,.28) 0,rgba(208,255,20,.08) 38%,rgba(208,255,20,0) 62%);animation:in-onda 1.2s .3s both ease-out}
#intro .in-letras{display:block;width:min(56vw,236px);height:auto;fill:#fff;animation:in-limpia .6s .45s both cubic-bezier(.25,.8,.25,1)}
#intro .in-carga{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;transition:opacity .3s}
#intro .in-carga i{display:block;width:40%;height:100%;border-radius:2px;background:#D0FF14;animation:in-barra 1s infinite ease-in-out}
#intro.cargando .in-carga{opacity:1}
#intro.sale{background-color:rgba(0,0,0,0);pointer-events:none}
#intro.sale .in-letras,#intro.sale .in-carga,#intro.sale .in-halo{opacity:0;transform:translateY(10px);transition:opacity .16s,transform .2s;animation:none}
#intro.sale.claro .cuerpo{fill:#0A0A0A}
#intro.sin-destino .in-vuelo{transform:scale(.55);opacity:0}
#intro.fin{opacity:0}
#intro.rapido .in-letras,#intro.rapido .in-halo{display:none}
#intro.rapido .in-marca{animation-duration:.5s,1s;animation-delay:0s,.1s}
#intro.rapido .acento{animation-delay:.2s}
#intro.quieto *{animation:none!important;transition:none!important}
.intro-espera{opacity:0!important}
.intro-llega{animation:in-llega .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes in-pop{0%{opacity:0;transform:scale(.3) rotate(-10deg)}55%{opacity:1;transform:scale(1.1) rotate(1.5deg)}78%{transform:scale(.97) rotate(0)}100%{opacity:1;transform:scale(1)}}
@keyframes in-luz{0%{opacity:0}40%{opacity:1}55%{opacity:.55}70%,100%{opacity:1}}
@keyframes in-brillo{0%{filter:drop-shadow(0 0 0 rgba(208,255,20,0))}35%{filter:drop-shadow(0 0 22px rgba(208,255,20,.55))}100%{filter:drop-shadow(0 0 8px rgba(208,255,20,.16))}}
@keyframes in-onda{0%{opacity:0;transform:scale(.25)}30%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
@keyframes in-limpia{0%{opacity:0;clip-path:inset(0 100% 0 0);transform:translateY(8px)}100%{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@keyframes in-barra{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes in-llega{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
</style>

<script>
(function () {
  var I = document.getElementById("intro"); if (!I) return;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, rapido = false;
  var ahora = Date.now();
  try { rapido = ahora - (Number(localStorage.getItem("autocare.intro")) || 0) < 600000; localStorage.setItem("autocare.intro", String(ahora)); } catch (e) { }
  if (rapido) I.classList.add("rapido"); if (reduce) I.classList.add("quieto");
  var t0 = performance.now(), minimo = reduce ? 150 : rapido ? 650 : 1250, listo = false, fuera = false;
  var carga = setTimeout(function () { I.classList.add("cargando"); }, 1500);
  // dónde aterriza el logo: barra del celular, menú de la computadora o pantalla de entrada (posición del símbolo dentro de cada logo)
  var LUGARES = [[".barra-movil .marca-logo img", 0, 0, 1], [".lateral .marca-h", .001, .004, .282], [".entrada-marca img", .164, .0025, .672]];
  function destino() {
    for (var i = 0; i < LUGARES.length; i++) {
      var l = document.querySelectorAll(LUGARES[i][0]);
      for (var j = 0; j < l.length; j++) { var r = l[j].getBoundingClientRect(); if (r.width > 0 && r.bottom > 0 && r.top < innerHeight) return { el: l[j], x: r.left + LUGARES[i][1] * r.width, y: r.top + LUGARES[i][2] * r.height, w: LUGARES[i][3] * r.width }; }
    }
    return null;
  }
  function salir() {
    if (fuera) return; fuera = true; clearTimeout(carga);
    var V = I.querySelector(".in-vuelo"), M = I.querySelector(".in-marca"), T = reduce ? null : destino();
    if (document.documentElement.dataset.tema === "claro") I.classList.add("claro");
    I.classList.add("sale");
    if (T) {
      var r = M.getBoundingClientRect(); T.el.classList.add("intro-espera");
      V.style.transform = "translate(" + (T.x - r.left) + "px," + (T.y - r.top) + "px) scale(" + (T.w / r.width) + ")";
      setTimeout(function () { T.el.classList.remove("intro-espera"); T.el.classList.add("intro-llega"); I.classList.add("fin"); setTimeout(function () { T.el.classList.remove("intro-llega"); }, 550); }, 600);
    } else { I.classList.add("sin-destino"); I.classList.add("fin"); }
    setTimeout(function () { if (I.parentNode) I.parentNode.removeChild(I); }, T ? 800 : 400);
  }
  window.introListo = function () {
    if (listo) return; listo = true;
    setTimeout(function () { requestAnimationFrame(function () { requestAnimationFrame(salir); }); }, Math.max(0, minimo - (performance.now() - t0)));
  };
  I.addEventListener("click", function () { if (listo) salir(); });
  setTimeout(salir, 9000); // por si algo falla, nunca se queda tapando la app
})();
</script>
