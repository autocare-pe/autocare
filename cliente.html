<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cuenta · AUTOCARE</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="app/icons/icon-192.png">
<link rel="stylesheet" href="assets/web.css">
<script src="config.js"></script>
</head>
<body>
<header class="cab"><div class="envoltura"><a class="logo" href="./" aria-label="AUTOCARE"><img src="assets/logo-horizontal-claro.svg" alt="AUTOCARE"></a><a class="btn oro chico" href="./#paquetes" style="margin-left:auto">Separar mi próxima hora</a></div></header>
<main class="envoltura" style="max-width:720px;padding:28px 0 80px" id="app"><p class="nota">Cargando tu información…</p></main>
<script type="module">
import { api, h, soles, fechaLarga, wa, firma } from "./assets/web.js";
const $ = s => document.querySelector(s);
const t = (location.hash.match(/t=([\w-]+)/) || [])[1] || "";
let D = null;
const accion = async (accion, d = {}) => {
  try { await api("portalAccion", Object.assign({ t, accion }, d)); await cargar(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  catch (e) { alerta(e.message); }
};
function alerta(m) { const a = $("#alerta"); if (a) { a.textContent = m; a.classList.remove("oculto"); a.scrollIntoView({ block: "center" }); } }

function pintar() {
  const n = D.negocio, c = D.cliente, f = D.fidelidad;
  const caja = (titulo, cuerpo) => `<section class="caja tarjeta"><h2>${titulo}</h2>${cuerpo}</section>`;
  let out = `<h1 style="font-stretch:118%;font-weight:780;font-size:32px;line-height:1.1;margin-bottom:6px">Hola, ${h(c.nombre)}</h1><p class="nota" style="margin-bottom:22px">Tu espacio personal en ${h(n.nombre)}.</p><div id="alerta" class="aviso rojo oculto" style="margin-bottom:14px"></div>`;
  D.recepciones.forEach(r => out += caja("Revisa y firma la llegada de tu auto", `<p class="nota">${h(r.numero || "")} · ${h(r.vehiculo)} · ${fechaLarga(r.fecha)}</p>
    ${r.items.length ? r.items.map(i => `<div class="par"><span>${h(i.zona)}</span><b>${h(({ rayon: "Rayón", abolladura: "Abolladura", mancha: "Mancha", rotura: "Rotura o falta pieza", otro: "Otro" })[i.estado] || i.estado)}${i.nota ? ": " + h(i.nota) : ""}</b></div>`).join("") : `<p style="margin:10px 0">Sin observaciones: el auto llegó en buen estado.</p>`}
    ${r.objetos ? `<div class="par"><span>Objetos en el auto</span><b>${h(r.objetos)}</b></div>` : ""}${r.obs ? `<p style="margin:8px 0">${h(r.obs)}</p>` : ""}
    ${r.fotos.length ? `<div class="fotos">${r.fotos.map(s => `<img src="${h(s)}" alt="Foto de llegada" loading="lazy">`).join("")}</div>` : ""}
    ${firmaForm("rec-" + r.id, "Firmo que revisé el estado de mi auto", "Firmar")}`));
  D.cotizaciones.filter(x => x.estado === "enviada").forEach(q => out += caja("Cotización " + h(q.numero || ""), `${q.items.map(i => `<div class="par"><span>${h(i.nombre)}${i.cant > 1 ? " ×" + i.cant : ""}</span><b>${soles(i.precio * (i.cant || 1))}</b></div>`).join("")}
    ${q.descuento ? `<div class="par"><span>Descuento</span><b>−${soles(q.descuento)}</b></div>` : ""}<div class="par total"><span>Total</span><b>${soles(q.total)}</b></div>
    ${q.nota ? `<p style="margin:8px 0">${h(q.nota)}</p>` : ""}<p class="nota">Válida hasta el ${fechaLarga(q.vence)}.</p>
    ${firmaForm("cot-" + q.id, "Acepto esta cotización", "Aceptar")}<button class="btn chico" style="margin-top:8px" data-rechazar="${q.id}">No me interesa</button>`));
  D.calificar.forEach(o => out += caja("¿Cómo quedó tu auto?", `<p class="nota">${h(o.servicios)} · ${fechaLarga(o.fecha)}</p>
    <div class="estrellas" data-orden="${o.id}" style="margin:12px 0">${[1, 2, 3, 4, 5].map(i => `<button data-e="${i}" aria-label="${i} estrellas">★</button>`).join("")}</div>
    <p style="margin:12px 0 8px">Del 0 al 10, ¿qué tan probable es que nos recomiendes a un amigo?</p><div class="nps" data-orden="${o.id}">${Array.from({ length: 11 }, (_, i) => `<button data-n="${i}">${i}</button>`).join("")}</div>
    <textarea class="entrada" id="com-${o.id}" placeholder="¿Algo que quieras contarnos?" style="margin-top:12px"></textarea>
    <button class="btn oro bloque" style="margin-top:12px" data-calificar="${o.id}">Enviar mi opinión</button>`));
  if (D.citas.length) out += caja("Tus próximas citas", D.citas.map(x => `<div style="padding:10px 0;border-top:1px solid var(--linea)"><b>${fechaLarga(x.fecha)}, ${h(x.hora)}</b><p class="nota">${h(x.servicios)}${x.direccion ? " · " + h(x.direccion) : ""}</p>
    ${x.estado === "solicitada" ? `<p class="nota">Por confirmar. Te escribiremos por WhatsApp.</p>` : ""}${x.adelanto && x.adelantoEstado !== "recibido" ? `<p class="nota">Adelanto pendiente: ${soles(x.adelanto)}${n.yape && n.yape.numero ? " por Yape al " + h(n.yape.numero) : ""}.</p>` : ""}
    <div style="display:flex;gap:8px;margin-top:8px">${!x.confirmo ? `<button class="btn oro chico" data-confirmar="${x.id}">Confirmo que estaré</button>` : `<span class="nota">✓ Confirmaste</span>`}<button class="btn chico" data-cancelar="${x.id}">Cancelar</button></div></div>`).join(""));
  if (f.activo) out += caja("Tu tarjeta de sellos", `<div class="sellos">${Array.from({ length: f.cada }, (_, i) => `<span class="sello ${i < f.actuales ? "si" : ""}">${i < f.actuales ? "✦" : i === f.cada - 1 ? "🎁" : ""}</span>`).join("")}</div>
    <p>${f.disponibles ? `<b>¡Completaste tu tarjeta! Tu ${h(f.premio || "premio")} es gratis.</b> Úsalo en tu próxima cita.` : f.actuales ? `<b>Ya llevas ${f.actuales} de ${f.cada}.</b> Te faltan solo ${f.cada - f.actuales} para tu ${h(f.premio || "premio")} gratis.` : `Tu tarjeta empieza con tu primer servicio, y llega con sellos de regalo.`}</p>
    ${D.referido.codigo ? `<p class="nota" style="margin-top:10px">Recomienda con tu código <b>${h(D.referido.codigo)}</b>: cada amigo que venga te suma ${f.bono || 1} ${(f.bono || 1) === 1 ? "sello" : "sellos"}.</p>
    <button class="btn chico" style="margin-top:10px" id="compartir">Compartir mi enlace</button>` : ""}`);
  if (D.plan) out += caja("Tu plan", `<p><b>${h(D.plan.nombre)}</b> · ${h(D.plan.incluye)}</p><p class="nota">Este mes usaste ${D.plan.usos} servicio(s)${D.plan.fin ? ". Vigente hasta el " + fechaLarga(D.plan.fin) : ""}.</p>`);
  if (D.historial.length) out += caja("Tu historial", D.historial.map(o => `<div style="padding:12px 0;border-top:1px solid var(--linea)"><div class="par" style="padding:0"><span>${fechaLarga(o.fecha)} · ${h(o.servicios)}</span><b>${o.cobro === "normal" ? soles(o.total) : o.cobro === "premio" ? "Premio" : ""}</b></div>
    ${o.antes.length && o.despues.length ? `<div class="comparar" style="margin-top:10px"><img src="${h(o.antes[0])}" alt="Antes" loading="lazy"><img class="despues" src="${h(o.despues[0])}" alt="Después" loading="lazy"><span class="et" style="left:10px">Antes</span><span class="et" style="right:10px">Después</span><span class="barra-c"></span><input type="range" min="0" max="100" value="50" aria-label="Comparar"></div>`
      : o.antes.length || o.despues.length ? `<div class="fotos">${[...o.antes, ...o.despues].slice(0, 4).map(s => `<img src="${h(s)}" alt="Foto" loading="lazy">`).join("")}</div>` : ""}</div>`).join(""));
  out += caja("Tus datos", `<div class="campos"><label class="campo">Correo<input class="entrada" id="d-email" value="${h(c.email)}"></label><label class="campo">Cumpleaños<input class="entrada" type="date" id="d-cumple" value="${h(c.cumple)}"></label>
    <label class="check todo"><input type="checkbox" id="d-acepta" ${c.acepta ? "checked" : ""}> Quiero recibir recordatorios y promociones por WhatsApp</label></div><button class="btn chico" style="margin-top:12px" id="d-guardar">Guardar mis datos</button>`);
  const red = n.redes || {}, redes = [red.ig && `<a class="btn chico" href="https://instagram.com/${h(String(red.ig).replace("@", ""))}" target="_blank" rel="noopener">Ver más trabajos en Instagram</a>`, red.tt && `<a class="btn chico" href="https://tiktok.com/@${h(String(red.tt).replace("@", ""))}" target="_blank" rel="noopener">Ver videos en TikTok</a>`].filter(Boolean);
  out += caja("Tu próximo lavado", `<p class="nota" style="margin-bottom:12px">Separa tu hora en un minuto y mantén tu auto como nuevo.</p><a class="btn oro bloque" href="./#paquetes">Separar mi próxima hora</a>${redes.length ? `<div class="redes" style="margin-top:12px">${redes.join("")}</div>` : ""}`);
  out += `<p class="nota" style="text-align:center;margin-top:20px">${n.tel ? `<a href="${wa(n.tel, "Hola, soy " + c.nombre + ".")}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a> · ` : ""}<a href="./">Ver servicios y reservar</a></p>`;
  $("#app").innerHTML = out;
  conectar();
}
const firmas = {};
function firmaForm(id, texto, boton) {
  return `<div style="margin-top:14px"><label class="campo">Tu nombre completo<input class="entrada" id="nom-${id}" value="${h([D.cliente.nombre, D.cliente.apellido].filter(Boolean).join(" "))}"></label>
    <p class="nota" style="margin:10px 0 6px">${texto}. Firma con el dedo:</p><canvas class="firma" id="cv-${id}"></canvas>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn oro" data-firmar="${id}">${boton}</button><button class="btn chico" data-limpiar="${id}">Borrar firma</button></div></div>`;
}
function conectar() {
  document.querySelectorAll("canvas.firma").forEach(cv => (firmas[cv.id.slice(3)] = firma(cv)));
  document.querySelectorAll(".comparar input").forEach(i => { i.oninput = () => i.parentElement.style.setProperty("--corte", i.value + "%"); });
  const sel = {};
  $("#app").onclick = async e => {
    const b = e.target.closest("button"); if (!b) return;
    const ds = b.dataset;
    if (ds.limpiar) firmas[ds.limpiar].limpiar();
    else if (ds.firmar) {
      const [tipo, id] = [ds.firmar.slice(0, 3), ds.firmar.slice(4)], nombre = $("#nom-" + ds.firmar).value.trim(), dibujo = firmas[ds.firmar].datos();
      if (!nombre) return alerta("Escribe tu nombre."); if (!dibujo) return alerta("Firma en el recuadro blanco, por favor.");
      b.disabled = true; await accion(tipo === "rec" ? "firmarRecepcion" : "aprobarCotizacion", { id, nombre, firma: dibujo });
    } else if (ds.rechazar) { const m = prompt("¿Nos cuentas por qué? (opcional)") ; if (m !== null) accion("rechazarCotizacion", { id: ds.rechazar, motivo: m }); }
    else if (ds.confirmar) accion("confirmarCita", { id: ds.confirmar });
    else if (ds.cancelar) { const m = prompt("¿Por qué cancelas? (opcional)"); if (m !== null) accion("cancelarCita", { id: ds.cancelar, motivo: m }); }
    else if (ds.e) { const p = b.parentElement; sel["e" + p.dataset.orden] = Number(ds.e); p.querySelectorAll("button").forEach(x => x.classList.toggle("si", Number(x.dataset.e) <= Number(ds.e))); }
    else if (ds.n !== undefined) { const p = b.parentElement; sel["n" + p.dataset.orden] = Number(ds.n); p.querySelectorAll("button").forEach(x => x.classList.toggle("si", x === b)); }
    else if (ds.calificar) {
      const id = ds.calificar; if (!sel["e" + id]) return alerta("Elige de 1 a 5 estrellas.");
      b.disabled = true;
      try {
        await api("portalAccion", { t, accion: "calificar", id, estrellas: sel["e" + id], nps: sel["n" + id] ?? "", comentario: $("#com-" + id).value });
        const g = D.negocio.google;
        b.closest("section").innerHTML = `<h2>¡Gracias por tu opinión!</h2><p style="margin:8px 0 14px">Nos ayuda a mejorar cada servicio.</p>${g ? `<p class="nota" style="margin-bottom:10px">¿Nos ayudas contándolo también en Google? Toma un minuto.</p><a class="btn oro" href="${h(g)}" target="_blank" rel="noopener">Dejar reseña en Google</a>` : ""}`;
      } catch (err) { alerta(err.message); b.disabled = false; }
    } else if (b.id === "d-guardar") accion("datos", { email: $("#d-email").value, cumple: $("#d-cumple").value, acepta: $("#d-acepta").checked });
    else if (b.id === "compartir") {
      const txt = `Te recomiendo ${D.negocio.nombre}: lavan tu auto en tu casa. Reserva con mi código ${D.referido.codigo}: ${D.referido.enlace}`;
      if (navigator.share) navigator.share({ text: txt }).catch(() => { }); else location.href = wa("", txt);
    }
  };
}
async function cargar() {
  if (!t) { $("#app").innerHTML = `<div class="aviso">Este enlace está incompleto. Pide tu enlace personal por WhatsApp.</div>`; return; }
  try { D = await api("portal", { t }); pintar(); }
  catch (e) { $("#app").innerHTML = `<div class="aviso rojo">${h(e.message)}</div><p style="margin-top:16px"><a class="btn" href="./">Ir a la web</a></p>`; }
}
cargar();
</script>
</body>
</html>
